[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "index30fer-dupequest"
version = "0.1.0"
description = "对题目做归一化与近重复检测，标出重复题与改写题"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "index30fer" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://index30fer.github.io"
Repository = "https://github.com/index30fer/dupequest"
Issues = "https://github.com/index30fer/dupequest/issues"

[project.scripts]
dupequest = "dupequest:main"

[tool.setuptools]
py-modules = ["dupequest"]
